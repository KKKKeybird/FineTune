name: Nightly

on:
  workflow_dispatch:
  schedule:
    # 03:15 Asia/Shanghai (19:15 UTC on the previous day).
    - cron: '15 19 * * *'

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: |
          xcodebuild test \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -skip-testing:FineTuneUITests \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            -resultBundlePath build/NightlyTests.xcresult

      - name: Prepare nightly version
        run: |
          NIGHTLY_DATE="$(date -u +%Y%m%d)"
          NIGHTLY_TAG="nightly-${NIGHTLY_DATE}-${GITHUB_RUN_NUMBER}"
          NIGHTLY_VERSION="1.9.1-nightly.${NIGHTLY_DATE}.${GITHUB_RUN_NUMBER}"
          echo "NIGHTLY_DATE=${NIGHTLY_DATE}" >> "$GITHUB_ENV"
          echo "NIGHTLY_TAG=${NIGHTLY_TAG}" >> "$GITHUB_ENV"
          echo "NIGHTLY_VERSION=${NIGHTLY_VERSION}" >> "$GITHUB_ENV"

      - name: Build release
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=io.github.kkkkeybird.FineTune.nightly \
            MARKETING_VERSION="$NIGHTLY_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Package unsigned nightly
        run: |
          SOURCE_APP="$DERIVED_DATA/Build/Products/Release/FineTune.app"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/FineTune Nightly.app"
          mv "$SOURCE_APP" "$APP_PATH"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"

          plutil -replace CFBundleDisplayName -string 'FineTune Nightly' "$INFO_PLIST"
          plutil -replace CFBundleName -string 'FineTune Nightly' "$INFO_PLIST"
          plutil -replace CFBundleURLTypes.0.CFBundleURLName -string 'io.github.kkkkeybird.FineTune.nightly' "$INFO_PLIST"
          plutil -replace CFBundleURLTypes.0.CFBundleURLSchemes.0 -string 'finetune-nightly' "$INFO_PLIST"
          plutil -replace SUFeedURL -string 'https://raw.githubusercontent.com/KKKKeybird/FineTune/main/appcast-nightly.xml' "$INFO_PLIST"
          plutil -replace SUEnableAutomaticChecks -bool false "$INFO_PLIST"

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.zip"
          shasum -a 256 "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.zip" \
            > "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FineTune-Nightly-${{ env.NIGHTLY_VERSION }}
          path: |
            build/release/*.zip
            build/release/*.sha256
            appcast-nightly.xml
          retention-days: 14

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NIGHTLY_TAG" \
            "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.zip" \
            "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.sha256" \
            appcast-nightly.xml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FineTune Nightly ${NIGHTLY_DATE} (${GITHUB_RUN_NUMBER})" \
            --notes-file .github/NIGHTLY_RELEASE_NOTES.md
