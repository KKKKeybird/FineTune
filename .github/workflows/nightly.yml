name: Nightly

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Prepare commit-scoped release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          COMMIT_EPOCH="$(git show -s --format=%ct "$COMMIT_SHA")"
          NIGHTLY_DATE="$(date -u -r "$COMMIT_EPOCH" +%Y%m%d)"
          NIGHTLY_REVISION="${COMMIT_SHA:0:12}"
          NIGHTLY_TAG="nightly-${NIGHTLY_DATE}-${NIGHTLY_REVISION}"
          NIGHTLY_VERSION="1.9.1-nightly.${NIGHTLY_DATE}.${NIGHTLY_REVISION}"
          echo "NIGHTLY_TAG=${NIGHTLY_TAG}" >> "$GITHUB_ENV"
          echo "NIGHTLY_VERSION=${NIGHTLY_VERSION}" >> "$GITHUB_ENV"
          echo "NIGHTLY_COMMIT=${COMMIT_SHA}" >> "$GITHUB_ENV"

          if gh release view "$NIGHTLY_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Nightly ${NIGHTLY_TAG} already exists for this commit; nothing to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Xcode
        if: steps.release.outputs.publish == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build release
        if: steps.release.outputs.publish == 'true'
        run: |
          xcodebuild build \
            -project FineTune.xcodeproj \
            -scheme FineTune \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=io.github.kkkkeybird.FineTune.nightly \
            MARKETING_VERSION="$NIGHTLY_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned nightly
        if: steps.release.outputs.publish == 'true'
        run: |
          SOURCE_APP="$DERIVED_DATA/Build/Products/Release/FineTune.app"
          APP_PATH="$DERIVED_DATA/Build/Products/Release/FineTune Nightly.app"
          mv "$SOURCE_APP" "$APP_PATH"
          INFO_PLIST="$APP_PATH/Contents/Info.plist"

          plutil -replace CFBundleDisplayName -string 'FineTune Nightly' "$INFO_PLIST"
          plutil -replace CFBundleName -string 'FineTune Nightly' "$INFO_PLIST"
          plutil -replace CFBundleURLTypes.0.CFBundleURLName -string 'io.github.kkkkeybird.FineTune.nightly' "$INFO_PLIST"
          plutil -replace CFBundleURLTypes.0.CFBundleURLSchemes.0 -string 'finetune-nightly' "$INFO_PLIST"
          plutil -replace SUFeedURL -string 'https://raw.githubusercontent.com/KKKKeybird/FineTune/main/appcast-nightly.xml' "$INFO_PLIST"
          plutil -replace SUEnableAutomaticChecks -bool false "$INFO_PLIST"

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

          mkdir -p build/release
          ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" \
            "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.zip"
          shasum -a 256 "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.zip" \
            > "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.sha256"

      - name: Upload workflow artifact
        if: steps.release.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: FineTune-Nightly-${{ env.NIGHTLY_VERSION }}
          path: |
            build/release/*.zip
            build/release/*.sha256
            appcast-nightly.xml
          retention-days: 14

      - name: Publish prerelease
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NIGHTLY_TAG" \
            "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.zip" \
            "build/release/FineTune-Nightly-${NIGHTLY_VERSION}.sha256" \
            appcast-nightly.xml \
            --repo "$GITHUB_REPOSITORY" \
            --target "$NIGHTLY_COMMIT" \
            --prerelease \
            --title "FineTune Nightly ${NIGHTLY_VERSION}" \
            --notes-file .github/NIGHTLY_RELEASE_NOTES.md
